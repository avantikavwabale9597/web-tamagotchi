<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tamagotchi Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="nav-group">
        <label>Device</label>
        <select id="deviceColor">
          <option value="purple">Purple</option>
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </div>

      <div class="nav-group">
        <label>Background</label>
        <select id="bgTheme">
          <option value="lavendar">Lavendar</option>
          <option value="sunset">Sunset</option>
          <option value="mint">Mint</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>

    <div class="device" id="device">
      <div class="screen">
        <div class="screen-inner">
          <div class="menu">
            <img class="menu-item active" src="assets/menu/cutlery.png" />
            <img class="menu-item" src="assets/menu/game-controller.png" />
            <img class="menu-item" src="assets/menu/drugs.png" />
            <img class="menu-item" src="assets/menu/shower.png" />
            <img class="menu-item" src="assets/menu/light-bulb.png" />
          </div>

          <div class="info" id="infoText">Select action</div>
        </div>
      </div>

      <div class="buttons">
        <button onclick="moveLeft()">A</button>
        <button onclick="selectOption()">B</button>
        <button onclick="moveRight()">C</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
